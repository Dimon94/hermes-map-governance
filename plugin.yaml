name: map-governance
version: 0.1.0
description: Standalone governance plane for Hermes Maps
kind: standalone
manifest_version: 1
api_version: 1
license: MIT
homepage: https://github.com/Dimon94/hermes-map-governance
tags:
  - governance
  - dashboard
  - maps
config_schema:
  authority:
    type: object
    default:
      ceo_autonomous_decision_classes:
        - product
        - operational
      chairman_required_decision_classes:
        - delivery_authorization
        - budget_increase
        - scope_expansion
        - schedule_change
        - security
        - legal
        - cancellation
        - remote_publication
        - final_acceptance
      authority_thresholds: {}
      chairman_actor_ids: []
      approval_ttl_seconds: 86400
